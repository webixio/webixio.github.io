<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webixio Developer Info</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #0b0719 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(147, 51, 234, 0.2);
      --text-main: #f3f4f6;
      --text-muted: #a5b4fc;
      --heading-gradient: linear-gradient(90deg, #60a5fa, #c084fc);
      --accent-blue: #3b82f6;
      --accent-purple: #a855f7;
      --link-hover: #e0e7ff;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(168, 85, 247, 0.1);
    }

    h1 {
      background: var(--heading-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0;
      font-size: 2.2rem;
    }

    h2 {
      color: #93c5fd;
      font-size: 1.4rem;
      margin-top: 24px;
    }

    p {
      line-height: 1.6;
      color: var(--text-main);
    }

    .intro {
      color: var(--text-muted);
    }

    hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-blue), transparent);
      margin: 24px 0;
    }

    strong {
      color: var(--text-muted);
    }

    a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    a:hover {
      color: var(--link-hover);
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Webixio - Developer</h1>
    <p class="intro">This website serves as the technical validation domain for our application, Webixio.</p>
    
    <hr>
    
    <h2>Developer Contact</h2>
    <p><strong>Name:</strong> MERI WITTENBERG </p>
    <p><strong>Contact Email:</strong> <a href="mailto:support@webixio.app">support@Webixio.app</a></p>
    <p><strong>Privacy Policy:</strong> <a href="" target="_blank" rel="noopener noreferrer">View Privacy Policy</a></p>
  </div>

</body>
</html>
